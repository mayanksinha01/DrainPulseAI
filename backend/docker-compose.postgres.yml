version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: drainpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drainpulse}
      POSTGRES_USER: ${POSTGRES_USER:-drainpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drainpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
